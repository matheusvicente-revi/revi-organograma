<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organograma Revi</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f0f;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    .logo {
      font-size: 2rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
      margin-bottom: 2rem;
    }
    .logo span {
      color: #7C3AED;
    }
    .icon {
      font-size: 3rem;
      margin-bottom: 1.5rem;
      display: block;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 0.75rem;
    }
    p {
      font-size: 1rem;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Re<span>vi</span></div>
    <span class="icon">🔧</span>
    <h1>Em manutenção</h1>
    <p>Voltamos em breve.</p>
  </div>
</body>
</html>
